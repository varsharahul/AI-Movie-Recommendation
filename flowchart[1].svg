<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">Flowchart</title>
<desc id="desc">Start, process, decision. No connects through connector A to Document. Yes continues through Data to Document and End.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #222; text-anchor: middle; dominant-baseline: middle; }
    .flow { fill: none; stroke: #222; stroke-width: 3; marker-end: url(#arrow); }
    .shape { stroke-width: 3; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<!-- Start terminator -->
<rect x="235" y="35" width="290" height="72" rx="36" fill="#fff" stroke="#9caf63" class="shape"/>
<text x="380" y="71">Start Terminator</text>
<path class="flow" d="M380 107 V160"/>
<!-- Process -->
<rect x="235" y="160" width="290" height="66" fill="#fff" stroke="#477e9f" class="shape"/>
<text x="380" y="193">Process</text>
<path class="flow" d="M380 226 V272"/>
<!-- Decision -->
<path d="M380 272 L510 365 L380 458 L250 365 Z" fill="#fff" stroke="#bd796c" class="shape"/>
<text x="380" y="365">Decision</text>
<!-- No path and connector A -->
<path class="flow" d="M510 365 H625"/>
<text x="558" y="391" font-size="16">No</text>
<circle cx="670" cy="365" r="30" fill="#fff" stroke="#d5a04c" class="shape"/>
<text x="670" y="365">A</text>
<!-- Yes path -->
<path class="flow" d="M380 458 V520"/>
<text x="418" y="491" font-size="16">Yes</text>
<!-- Data parallelogram -->
<path d="M275 520 H485 L525 570 H235 Z" fill="#fff" stroke="#548eb5" class="shape"/>
<text x="380" y="545">Data</text>
<path class="flow" d="M380 570 V630"/>
<!-- Connector A from left to document -->
<circle cx="90" cy="665" r="30" fill="#fff" stroke="#d5a04c" class="shape"/>
<text x="90" y="665">A</text>
<path class="flow" d="M120 665 H235"/>
<!-- Document -->
<path d="M235 630 H525 V690 H235 Z" fill="#fff" stroke="#8975a8" class="shape"/>
<text x="380" y="660">Document</text>
<path class="flow" d="M380 690 V750"/>
<!-- End terminator -->
<rect x="235" y="750" width="290" height="72" rx="36" fill="#fff" stroke="#9caf63" class="shape"/>
<text x="380" y="786">End Terminator</text>
</svg>